name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wrapper
          POSTGRES_PASSWORD: wrapper
          POSTGRES_DB: wrapper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wrapper" --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - name: tests (SQLite)
        run: uv run pytest -q
      - name: tests (PostgreSQL)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://wrapper:wrapper@localhost:5432/wrapper_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build
